<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deniz Savaşı</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="lobby" class="screen">
    <h1>⚓ Deniz Savaşı</h1>
    <div id="roomList"></div>
    <form id="joinForm">
      <input id="room" placeholder="Oda adı" value="oda1" />
      <input id="nick" placeholder="Rumuz (zorunlu)" maxlength="16" autocomplete="off" required />
      <div class="factions">
        <label><input type="radio" name="faction" value="pirate" checked /> 🏴‍☠️ Korsan</label>
        <label><input type="radio" name="faction" value="navy" /> ⚓ Donanma</label>
      </div>
      <div id="ships" class="ships"></div>
      <label class="flabel">Bayrak rengi:</label>
      <div id="flags" class="flags"></div>
      <label class="sea"><input type="checkbox" id="calmSea" /> Durgun deniz (daha akıcı / performans)</label>
      <div id="joinErr" class="err hidden"></div>
      <button type="submit">Odaya Katıl</button>
    </form>
  </div>
  <div id="lobbyRoom" class="screen hidden">
    <h1>⚓ Lobi — <span id="roomName"></span></h1>
    <div class="roster">
      <div class="team">
        <h2>🏴‍☠️ Korsan (<span id="pcount">0</span>)</h2>
        <ul id="plist"></ul>
        <button class="teamBtn" data-faction="pirate">Bu takıma geç</button>
      </div>
      <div class="team">
        <h2>⚓ Donanma (<span id="ncount">0</span>)</h2>
        <ul id="nlist"></ul>
        <button class="teamBtn" data-faction="navy">Bu takıma geç</button>
      </div>
    </div>
    <div class="npcRow">
      <label>⚔️ Asker basma süresi: <input type="number" id="npcSec" min="3" max="120" value="15" /> sn</label>
    </div>
    <button id="startBtn" class="hidden">Oyunu Başlat</button>
    <div id="waitMsg" class="hidden">Kurucunun oyunu başlatması bekleniyor…</div>
  </div>
  <canvas id="game" class="screen hidden"></canvas>
  <div id="audioCtl" class="hidden">
    <span>🎵</span>
    <input id="musicVol" type="range" min="0" max="100" value="60" title="Müzik sesi" />
    <button id="muteBtn" type="button" title="Sustur">🔊</button>
    <button id="waveBtn" type="button" title="Dalga aç/kapa">🌊</button>
  </div>
  <div id="endScreen" class="screen hidden"></div>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
